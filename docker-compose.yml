services:
  bracket-api:
    build: .
    container_name: bracket-api
    ports:
      - "8000:8000"
    environment:
      BRACKET_DB: /data/bracket.db
    volumes:
      - bracket-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bracket-data:
